<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>igo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- SIGN IN MODAL -->
<div id="signinModal" class="modal open">
  <div class="modal-card">
    <div class="modal-header">
      <h2>Sign in to igo</h2>
      <button class="link" onclick="closeSignin()">Close</button>
    </div>

    <!-- STEP 1 -->
    <div id="emailStep">
      <label>Email</label>
      <input id="signinEmail" type="email" placeholder="you@email.com" />
      <button class="btn-primary" onclick="onSendCodeClick()">Send code</button>
      <p class="muted">
        We’ll send a 6-digit code to your email.
        For testing, you can use <b>555555</b>.
      </p>
    </div>

    <!-- STEP 2 -->
    <div id="codeStep" style="display:none;">
      <label>Verification code</label>
      <input id="signinCode" type="text" maxlength="6" placeholder="123456" />
      <button class="btn-primary" onclick="onVerifyCodeClick()">Verify</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="appRoot" style="display:none;">
  <!-- your existing UI stays here exactly as-is -->
</div>

<!-- SCRIPTS -->
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="ui.js"></script>

</body>
</html>
